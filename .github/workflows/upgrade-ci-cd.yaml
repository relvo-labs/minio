name: Upgrade old version tests

on:
  workflow_dispatch:

# Manual runs are keyed by run id, so they never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Go (go.mod toolchain) on ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Go toolchain matches go.mod
        run: make ci-go-version
      - name: Start upgrade tests
        run: |
          make test-upgrade
