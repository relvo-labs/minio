name: VulnCheck
on:
  workflow_dispatch:
  pull_request:
    types:
      - ready_for_review
    branches:
      - master

# A newer Ready transition cancels an older run for the same PR. Manual runs
# are keyed by run id, so they never share a group or cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  vulncheck:
    name: Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Pinned govulncheck; text mode exits nonzero on reachable findings.
      - name: Run govulncheck
        run: make ci-vulncheck
        shell: bash
