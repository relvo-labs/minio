name: Race Tests

# Manual only: the full -race suite (unchanged buildscripts/race.sh, upstream
# GORACE=history_size=7) is resource-heavy. It used to run inside the portable
# "Linters and Tests" workflow as `make test-race`; build, generated-code and
# lint verifiers stay in go-lint.yml.
on:
  workflow_dispatch:

# Manual runs are keyed by run id, so they never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  race:
    name: Unit tests under -race (buildscripts/race.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Unit tests under -race
        run: |
          sudo sysctl net.ipv6.conf.all.disable_ipv6=0
          sudo sysctl net.ipv6.conf.default.disable_ipv6=0
          make ci-test-race
