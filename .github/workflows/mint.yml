name: Mint Tests

on:
  workflow_dispatch:

# Manual runs are keyed by run id, so they never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# Runs on a GitHub-hosted runner (the upstream self-hosted "mint" runner is not
# available to this fork). The server is built from this checkout; only the
# upstream Mint conformance client and nginx are pulled. No secrets are used.
jobs:
  mint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: checkout-step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup-go-step
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Go toolchain matches go.mod
        run: make ci-go-version

      - name: github sha short
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: build Granary server from source
        env:
          SHA_SHORT: ${{ steps.vars.outputs.sha_short }}
        run: docker build -t "granary-ci:${SHA_SHORT}" -f Dockerfile .

      - name: multipart upgrade scenario disabled (#30)
        run: echo "SKIP (#30) multipart migration requires the unavailable upstream RELEASE.2023-08-29T23-07-35Z server image."

      - name: compress and encrypt
        env:
          SHA_SHORT: ${{ steps.vars.outputs.sha_short }}
        run: |
          ${GITHUB_WORKSPACE}/.github/workflows/run-mint.sh "compress-encrypt" "minio" "minio123" "${SHA_SHORT}"

      - name: multiple pools
        env:
          SHA_SHORT: ${{ steps.vars.outputs.sha_short }}
        run: |
          ${GITHUB_WORKSPACE}/.github/workflows/run-mint.sh "pools" "minio" "minio123" "${SHA_SHORT}"

      - name: standalone erasure
        env:
          SHA_SHORT: ${{ steps.vars.outputs.sha_short }}
        run: |
          ${GITHUB_WORKSPACE}/.github/workflows/run-mint.sh "erasure" "minio" "minio123" "${SHA_SHORT}"

      # FIXME: renable this back when we have a valid way to add deadlines for PUT()s (internode CreateFile)
      # - name: resiliency
      #   run: |
      #     ${GITHUB_WORKSPACE}/.github/workflows/run-mint.sh "resiliency" "minio" "minio123" "${SHA_SHORT}"

      - name: The job must cleanup
        if: ${{ always() }}
        env:
          SHA_SHORT: ${{ steps.vars.outputs.sha_short }}
        run: |
          # Only this job's Compose resources and local server image.
          if [ -n "${SHA_SHORT}" ]; then
            export JOB_NAME="${SHA_SHORT}"
            export COMPOSE_PROJECT_NAME="granary-mint-${SHA_SHORT}"
            for mode in compress-encrypt pools erasure; do
              docker rm -f "mint-${mode}-${JOB_NAME}" 2>/dev/null || true
              docker compose -f "${GITHUB_WORKSPACE}/.github/workflows/mint/minio-${mode}.yaml" down --volumes --remove-orphans || true
            done
            docker image rm "granary-ci:${SHA_SHORT}" || true
          fi
