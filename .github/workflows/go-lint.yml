name: Linters and Tests

on:
  workflow_dispatch:
  pull_request:
    types:
      - ready_for_review
    branches:
      - master

# A newer Ready transition cancels an older run for the same PR. Manual runs
# are keyed by run id, so they never share a group or cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-policy:
    name: Workflow policy (pinned PyYAML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Go toolchain matches go.mod
        run: make ci-go-version
      - name: Workflow trigger, pinning and permission policy
        run: make ci-policy

  build:
    name: Build, generated code, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Go toolchain matches go.mod
        run: make ci-go-version
      - name: Build
        env:
          CGO_ENABLED: 0
          GO111MODULE: on
        run: |
          sudo apt install jq -y
          sudo sysctl net.ipv6.conf.all.disable_ipv6=0
          sudo sysctl net.ipv6.conf.default.disable_ipv6=0
          make ci-build
      - name: golangci-lint (pinned, repository .golangci.yml)
        run: make ci-lint
      - name: Unit tests
        run: |
          sudo sysctl net.ipv6.conf.all.disable_ipv6=0
          sudo sysctl net.ipv6.conf.default.disable_ipv6=0
          make ci-test
      # Last: go generate / go mod tidy rewrite the checkout, so lint and tests
      # above always see the committed source.
      - name: Generated code and go.sum are committed
        if: ${{ !cancelled() }}
        run: make ci-check-gen
      # The -race suite (buildscripts/race.sh) is resource-heavy and runs only
      # by manual dispatch of go-race.yml.
